name: CI

on:
  pull_request:
    branches: [main, dev-thiago-02]
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - "guildsbook-app/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, dev-thiago-02]
    paths:
      - "guildsbook-app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: guildsbook-app
  NODE_VERSION: "20"
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/guildsbook_ci?schema=public"
  NEXTAUTH_URL: "http://localhost:3000"
  NEXTAUTH_SECRET: "ci-nextauth-secret-not-for-production"
  AUTH_SECRET: "ci-auth-secret-not-for-production"

jobs:
  branch-name:
    name: branch-name
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR branch name
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Não é PR (push / dispatch) — skip da validação de nome"
            exit 0
          fi

          name=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]')
          echo "branch=$name"

          if echo "$name" | grep -Eq '^(feat|feature|hotfix|fix|bugfix|bug|ref|refactor|ci|docs|chore|dev)/[a-z0-9._-]+$'; then
            echo "nome de branch válido"
            exit 0
          fi

          if echo "$name" | grep -Eq '^dev-[a-z0-9._-]+$'; then
            echo "nome de branch long-lived válido"
            exit 0
          fi

          echo "::error::Branch inválida: '$BRANCH'"
          echo "Use: type/descricao-em-kebab-case"
          echo "Tipos: feat/  feature/  hotfix/  fix/  bugfix/  bug/  ref/  refactor/  ci/  docs/  chore/  dev/"
          echo "Long-lived: dev-seu-nome (ex.: dev-thiago-02)"
          echo "Exemplo: feat/reading-list-share"
          exit 1

      - name: Validate PR title
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Não é PR — skip da validação de título"
            exit 0
          fi

          echo "title=$TITLE"
          if echo "$TITLE" | grep -Eq '^(feat|feature|hotfix|fix|bugfix|bug|ref|refactor|ci|docs|chore)(\([a-z0-9_-]+\))?: .+'; then
            echo "título de PR válido"
            exit 0
          fi

          echo "::error::Título de PR inválido: '$TITLE'"
          echo "Use conventional commits: tipo: descrição"
          echo "Tipos: feat:  fix:  bug:  ref:  ci:  docs:  chore:"
          echo "Exemplo: feat: compartilhar lista de leitura"
          echo "Com escopo: feat(auth): ajusta callback do Google OAuth"
          exit 1

  review-context:
    name: review-context
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR size + files for review
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "## Code review context" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**PR:** #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          stats=$(git diff --shortstat "$BASE...$HEAD" || true)
          files=$(git diff --name-only "$BASE...$HEAD" || true)
          file_count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l | tr -d ' ')
          additions=$(git diff --numstat "$BASE...$HEAD" | awk '{ a+=$1 } END { print a+0 }')
          deletions=$(git diff --numstat "$BASE...$HEAD" | awk '{ d+=$2 } END { print d+0 }')

          echo "**Diff:** +${additions} / −${deletions} em ${file_count} arquivo(s)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$stats" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$stats\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Arquivos alterados" >> "$GITHUB_STEP_SUMMARY"
          if [ "$file_count" = "0" ]; then
            echo "_Nenhum arquivo alterado_" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "$files" | sed '/^$/d' | sed 's/^/- `/;s/$/`/' >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checklist do review" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Escopo do PR bate com o título/branch" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Sem secrets, tokens ou \`.env\` no diff" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Rotas API / Server Actions: auth e validação Zod ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Prisma: migration necessária? schema coerente?" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] UI: dark/light e mobile sem regressão óbvia" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ ] Breaking change de API/contrato documentada?" >> "$GITHUB_STEP_SUMMARY"

          total=$((additions + deletions))
          if [ "$total" -gt 800 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ Diff grande (${total} linhas). Prefira PRs menores para review com qualidade." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::PR grande: ${total} linhas alteradas. Considere dividir."
          fi

  lint:
    name: lint
    needs: branch-name
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  typecheck:
    name: typecheck
    needs: branch-name
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript (tsc --noEmit)
        run: npm run typecheck

  test-coverage-build:
    name: test-coverage-build
    needs: [branch-name, lint, typecheck]
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Test + coverage
        run: npm run test:coverage

      - name: Coverage gate (≥35%)
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::error::coverage-summary.json ausente"
            exit 1
          fi
          pct=$(node -e "const s=require('./coverage/coverage-summary.json').total.lines.pct; console.log(s)")
          echo "**${pct}%** lines (mínimo 35%)" >> "$GITHUB_STEP_SUMMARY"
          node -e "const p=require('./coverage/coverage-summary.json').total.lines.pct; if (p < 35) { console.error('Coverage abaixo de 35%:', p); process.exit(1) }"

      - name: Next.js production build
        run: npm run build

      - name: Build summary
        run: |
          echo "## Build" >> "$GITHUB_STEP_SUMMARY"
          echo "Next.js + Prisma generate OK (\`guildsbook-app\`)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ${{ env.APP_DIR }}/coverage/
          if-no-files-found: ignore

  security:
    name: security
    needs: branch-name
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high

  ci:
    name: ci
    if: always() && github.event.pull_request.draft != true
    needs: [branch-name, review-context, lint, typecheck, test-coverage-build, security]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        env:
          EVENT: ${{ github.event_name }}
          R_BRANCH: ${{ needs.branch-name.result }}
          R_REVIEW: ${{ needs.review-context.result }}
          R_LINT: ${{ needs.lint.result }}
          R_TSC: ${{ needs.typecheck.result }}
          R_TEST: ${{ needs.test-coverage-build.result }}
          R_SEC: ${{ needs.security.result }}
        run: |
          echo "branch-name=$R_BRANCH"
          echo "review-context=$R_REVIEW"
          echo "lint=$R_LINT"
          echo "typecheck=$R_TSC"
          echo "test-coverage-build=$R_TEST"
          echo "security=$R_SEC"

          fail=0
          [ "$R_BRANCH" = "failure" ] || [ "$R_BRANCH" = "cancelled" ] && fail=1
          [ "$R_LINT" = "failure" ] || [ "$R_LINT" = "cancelled" ] && fail=1
          [ "$R_TSC" = "failure" ] || [ "$R_TSC" = "cancelled" ] && fail=1
          [ "$R_TEST" = "failure" ] || [ "$R_TEST" = "cancelled" ] && fail=1
          [ "$R_SEC" = "failure" ] || [ "$R_SEC" = "cancelled" ] && fail=1

          if [ "$EVENT" = "pull_request" ]; then
            [ "$R_REVIEW" = "failure" ] || [ "$R_REVIEW" = "cancelled" ] && fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::CI falhou — não aprovar o PR até corrigir"
            exit 1
          fi

          echo "CI OK — pronto para review/aprovação"
